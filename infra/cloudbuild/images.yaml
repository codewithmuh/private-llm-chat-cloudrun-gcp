# Builds the app's four images IN Google Cloud and pushes them to Artifact
# Registry. scripts/deploy.sh submits it:
#
#   gcloud builds submit . --config=infra/cloudbuild/images.yaml \
#     --substitutions=_REGISTRY=<region>-docker.pkg.dev/<project>/llmchat-dev,_TAG=<tag>
#
# Only the source code is uploaded (see .gcloudignore); the builds run on a
# Google machine (linux/amd64, the platform Cloud Run runs), in parallel.
#   api     backend/Dockerfile      Django
#   web     frontend/Dockerfile     Next.js (built from the repository root:
#                                   the /docs pages and the model table come
#                                   from docs/ and ml/models/)
#   search  search/Dockerfile       SearXNG, for the chat's Search button
#   speech  speech/Dockerfile       Whisper, for the microphone button
# _SEARCH / _SPEECH = false skip an image (enable_web_search /
# enable_speech_to_text = false in terraform.tfvars).

substitutions:
  _REGISTRY: ""
  _TAG: ""
  _SEARCH: "true"
  _SPEECH: "true"

steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"] # start right away, next to the others
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - -c
      - docker build --target api -t ${_REGISTRY}/api:${_TAG} backend && docker push ${_REGISTRY}/api:${_TAG}

  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - -c
      # NEXT_PUBLIC_API_URL empty: the browser calls /api/ on the web service itself.
      - docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL= -t ${_REGISTRY}/web:${_TAG} . && docker push ${_REGISTRY}/web:${_TAG}

  - id: search
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - -c
      - if [ "${_SEARCH}" = true ]; then docker build -t ${_REGISTRY}/search:${_TAG} search && docker push ${_REGISTRY}/search:${_TAG}; else echo "search is turned off"; fi

  - id: speech
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - -c
      - if [ "${_SPEECH}" = true ]; then docker build -t ${_REGISTRY}/speech:${_TAG} speech && docker push ${_REGISTRY}/speech:${_TAG}; else echo "speech is turned off"; fi

options:
  # 8 vCPUs: four builds at once (Next.js and whisper.cpp compile for a while).
  machineType: E2_HIGHCPU_8
  # Logs only in Cloud Logging: required when a build runs as its own service account.
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
